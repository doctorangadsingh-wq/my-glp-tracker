<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angad's GLP Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        cardbg: '#1E1E1E',
                        neon: '#00E5FF',
                        lime: '#76FF03',
                        danger: '#FF1744'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: 'Segoe UI', sans-serif; }
        .nav-btn.active { border-bottom: 2px solid #76FF03; color: #76FF03; }
        input, select { background-color: #2C2C2C; border: 1px solid #333; color: white; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        
        /* Scrollbar hiding for cleaner look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="p-4 bg-cardbg border-b border-gray-800 flex justify-between items-center z-10">
        <h1 class="text-xl font-bold tracking-wider text-neon"><i class="fas fa-dna"></i> Angad's <span class="text-white">GLP Journey</span></h1>
        <button onclick="exportData()" class="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded border border-gray-600">
            <i class="fas fa-download"></i> Backup
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 pb-24" id="main-content">
        </main>

    <nav class="fixed bottom-0 w-full bg-cardbg border-t border-gray-800 flex justify-around p-3 pb-6 z-50">
        <button onclick="switchView('dashboard')" class="nav-btn active flex flex-col items-center text-xs">
            <i class="fas fa-chart-line text-lg mb-1"></i> Dashboard
        </button>
        <button onclick="switchView('log')" class="nav-btn flex flex-col items-center text-xs">
            <i class="fas fa-plus-circle text-lg mb-1"></i> Log
        </button>
        <button onclick="switchView('gym')" class="nav-btn flex flex-col items-center text-xs">
            <i class="fas fa-dumbbell text-lg mb-1"></i> Gym
        </button>
        <button onclick="switchView('meds')" class="nav-btn flex flex-col items-center text-xs">
            <i class="fas fa-syringe text-lg mb-1"></i> GLP-1
        </button>
        <button onclick="switchView('predict')" class="nav-btn flex flex-col items-center text-xs">
            <i class="fas fa-calculator text-lg mb-1"></i> Predict
        </button>
    </nav>

    <script>
        // --- STATE MANAGEMENT ---
        const STORE_KEY = 'angad_glp_v3'; // Incremented key for fresh structure
        let appData = JSON.parse(localStorage.getItem(STORE_KEY)) || {
            user: { height: '', heightUnit: 'ft', weightUnit: 'kg' },
            weight: [],
            calories: [],
            protein: [],
            exercises: [],
            glp1: []
        };

        // --- SAVE DATA ---
        function saveData() {
            localStorage.setItem(STORE_KEY, JSON.stringify(appData));
            updateUI(); 
        }

        // --- VIEWS ---
        const views = {
            dashboard: () => `
                <div class="grid gap-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-cardbg p-4 rounded-lg shadow-lg border border-gray-800">
                            <h3 class="text-gray-400 text-xs uppercase">Current BMI</h3>
                            <p class="text-2xl font-bold text-neon" id="bmi-display">--</p>
                        </div>
                        <div class="bg-cardbg p-4 rounded-lg shadow-lg border border-gray-800">
                            <h3 class="text-gray-400 text-xs uppercase">Total Change</h3>
                            <p class="text-2xl font-bold text-lime" id="weight-loss-display">--</p>
                        </div>
                    </div>

                    <div class="bg-cardbg p-4 rounded-lg border border-gray-800">
                        <h3 class="text-white font-bold mb-4">Weight History (kg)</h3>
                        <div class="chart-container"><canvas id="weightChart"></canvas></div>
                    </div>
                    <div class="bg-cardbg p-4 rounded-lg border border-gray-800">
                        <h3 class="text-white font-bold mb-4">Calorie Intake</h3>
                        <div class="chart-container"><canvas id="calChart"></canvas></div>
                    </div>
                    <div class="bg-cardbg p-4 rounded-lg border border-gray-800">
                        <h3 class="text-white font-bold mb-4">Protein Intake</h3>
                        <div class="chart-container"><canvas id="proteinChart"></canvas></div>
                    </div>
                </div>
            `,
            log: () => `
                <div class="max-w-md mx-auto bg-cardbg p-6 rounded-lg border border-gray-800">
                    <h2 class="text-xl text-neon mb-6">Daily Logger</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-gray-400 text-sm mb-1">Date</label>
                            <input type="date" id="log-date" class="w-full p-3 rounded outline-none focus:border-neon">
                        </div>

                        <div class="border-t border-gray-700 pt-4">
                            <label class="block text-white mb-1">Weight (kg)</label>
                            <input type="number" step="0.1" id="log-weight" placeholder="e.g. 85.5" class="w-full p-3 rounded mb-2">
                            <button onclick="addEntry('weight')" class="w-full bg-blue-600 hover:bg-blue-500 text-white p-2 rounded">Log Weight</button>
                        </div>

                        <div class="border-t border-gray-700 pt-4">
                            <label class="block text-white mb-1">Calories (kcal)</label>
                            <input type="number" id="log-cals" placeholder="e.g. 1800" class="w-full p-3 rounded mb-2">
                            <button onclick="addEntry('calories')" class="w-full bg-purple-600 hover:bg-purple-500 text-white p-2 rounded">Log Calories</button>
                        </div>

                        <div class="border-t border-gray-700 pt-4">
                            <label class="block text-white mb-1">Protein (g)</label>
                            <input type="number" id="log-protein" placeholder="e.g. 140" class="w-full p-3 rounded mb-2">
                            <button onclick="addEntry('protein')" class="w-full bg-green-600 hover:bg-green-500 text-white p-2 rounded">Log Protein</button>
                        </div>
                    </div>
                </div>
            `,
            gym: () => `
                <div class="bg-cardbg p-4 rounded-lg border border-gray-800 mb-6">
                    <h2 class="text-xl text-lime mb-4"><i class="fas fa-dumbbell"></i> Workout Logger</h2>
                    
                    <div class="mb-4">
                        <label class="text-gray-400 text-sm">Date</label>
                        <input type="date" id="gym-date" class="w-full p-3 rounded mt-1 mb-2">

                        <label class="text-gray-400 text-sm">Select Exercise</label>
                        <select id="gym-select" class="w-full p-3 rounded mt-1" onchange="updateGymInputs()">
                            <option value="pushup">Push-Ups (Bodyweight)</option>
                            <option value="squat_bw">Squats (Bodyweight)</option>
                            <option value="squat_machine">Squats (Machine)</option>
                            <option value="squat_bar">Squats (Barbell)</option>
                            <option value="deadlift">Deadlift (Barbell)</option>
                            <option value="lat_pull">Lat Pull Down (Machine)</option>
                            <option value="bench">Bench Press (Barbell)</option>
                            <option value="shoulder">Shoulder Press (Barbell)</option>
                            <option value="bicep">Bicep Curl</option>
                            <option value="misc">Miscellaneous</option>
                        </select>
                        <p id="gym-hint" class="text-xs text-neon mt-2 italic"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-4">
                         <div>
                            <label class="text-gray-400 text-sm">Weight (kg)</label>
                            <input type="number" id="gym-weight-manual" class="w-full p-3 rounded mt-1 hidden" placeholder="Manual Input">
                            <select id="gym-weight" class="w-full p-3 rounded mt-1">
                                </select>
                        </div>
                        <div>
                            <label class="text-gray-400 text-sm">Sets</label>
                            <input type="number" id="gym-sets" placeholder="3" class="w-full p-3 rounded mt-1">
                        </div>
                    </div>
                    
                    <button onclick="logExercise()" class="w-full bg-lime text-black font-bold p-3 rounded hover:bg-green-400">LOG WORKOUT</button>
                </div>

                <div class="">
                    <h3 class="text-white font-bold mb-4 text-xl border-b border-gray-700 pb-2">Workout Diary</h3>
                    <div id="gym-diary" class="space-y-6"></div>
                </div>
            `,
            meds: () => `
                <div class="bg-cardbg p-6 rounded-lg border border-gray-800 text-center">
                    <h2 class="text-2xl text-neon mb-2">GLP-1 Tracker</h2>
                    <p class="text-gray-400 mb-6">Track your weekly injections</p>

                    <div id="glp-countdown" class="bg-gray-800 p-6 rounded-lg mb-6 border border-gray-700">
                        <h3 class="text-lg text-white">Next Dose In:</h3>
                        <p class="text-4xl font-bold text-lime my-2" id="days-left">--</p>
                        <p class="text-xs text-gray-500" id="next-date">Date: --</p>
                    </div>

                    <div class="text-left">
                        <label class="text-gray-400 text-sm">Log Injection Date</label>
                        <input type="date" id="glp-date" class="w-full p-3 rounded mt-1 mb-4">
                        <button onclick="logMeds()" class="w-full bg-neon text-black font-bold p-3 rounded">CONFIRM INJECTION</button>
                    </div>

                    <div class="mt-8 text-left">
                        <h4 class="text-white border-b border-gray-700 pb-2 mb-2">History</h4>
                        <ul id="meds-list" class="text-sm text-gray-400 space-y-2"></ul>
                    </div>
                </div>
            `,
            predict: () => `
                <div class="bg-cardbg p-6 rounded-lg border border-gray-800">
                    <h2 class="text-xl text-white mb-4"><i class="fas fa-flask text-neon"></i> Weight Loss Predictor</h2>
                    <p class="text-sm text-gray-400 mb-4">
                        Based on your last 14 log entries, we calculate your daily rate of change using linear regression math ($y = mx + b$).
                    </p>

                    <div class="bg-gray-900 p-4 rounded mb-4">
                        <div class="flex justify-between mb-2">
                            <span class="text-gray-400">Current Trend:</span>
                            <span id="trend-rate" class="font-mono text-white">--</span>
                        </div>
                         <div class="flex justify-between">
                            <span class="text-gray-400">R² Accuracy:</span>
                            <span id="trend-accuracy" class="font-mono text-white">--</span>
                        </div>
                    </div>

                    <label class="text-gray-400 text-sm">Predict my weight on:</label>
                    <input type="date" id="pred-date" class="w-full p-3 rounded mt-1 mb-4">
                    <button onclick="calculatePrediction()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded">CALCULATE</button>

                    <div id="pred-result" class="hidden mt-6 text-center border-t border-gray-700 pt-6">
                        <p class="text-gray-400">Predicted Weight:</p>
                        <p class="text-4xl font-bold text-neon mt-2" id="pred-value">--</p>
                    </div>
                </div>
            `
        };

        // --- CORE LOGIC ---

        function init() {
            // Check for first time setup (User Info)
            if(!appData.user.height) {
                const h = prompt("Welcome Angad! To start, enter your height in FEET (e.g. 5.9):", "5.9");
                if(h) {
                    appData.user.height = h;
                    saveData();
                }
            }
            switchView('dashboard');
            
            // Set default date inputs to today
            setTodayDates();
        }

        function setTodayDates() {
            const today = new Date().toISOString().split('T')[0];
            const dateInputs = document.querySelectorAll('input[type="date"]');
            if(dateInputs) dateInputs.forEach(i => i.value = today);
        }

        function switchView(viewName) {
            document.getElementById('main-content').innerHTML = views[viewName]();
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.nav-btn')[['dashboard','log','gym','meds','predict'].indexOf(viewName)].classList.add('active');

            if (viewName === 'dashboard') loadDashboard();
            if (viewName === 'gym') populateGymDropdowns();
            if (viewName === 'meds') loadMeds();

            setTodayDates();
        }

        function updateUI() {
            // Placeholder for reactivity
        }

        // --- DATA LOGGING FUNCTIONS ---

        function addEntry(type) {
            const date = document.getElementById('log-date').value;
            const valInput = document.getElementById(type === 'weight' ? 'log-weight' : type === 'calories' ? 'log-cals' : 'log-protein');
            const val = parseFloat(valInput.value);

            if (!date || isNaN(val)) return alert("Please enter valid data");

            const existingIndex = appData[type].findIndex(e => e.date === date);
            if (existingIndex > -1) {
                appData[type][existingIndex].value = val;
            } else {
                appData[type].push({ date: date, value: val });
            }
            
            appData[type].sort((a,b) => new Date(a.date) - new Date(b.date));
            
            saveData();
            valInput.value = '';
            alert(`${type} logged!`);
        }

        // --- GYM LOGIC ---

        function populateGymDropdowns() {
            const select = document.getElementById('gym-weight');
            select.innerHTML = '';
            // KG steps (2.5kg to 100kg)
            for(let i=2.5; i<=100; i+=2.5) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = i + " kg";
                select.appendChild(opt);
            }
            updateGymInputs();
            loadGymDiary();
        }

        function updateGymInputs() {
            const type = document.getElementById('gym-select').value;
            const hint = document.getElementById('gym-hint');
            const weightInput = document.getElementById('gym-weight');
            
            // Reset state
            weightInput.disabled = false;

            // Logic
            if(['deadlift', 'bench', 'shoulder', 'squat_bar'].includes(type)) {
                hint.innerText = "⚠️ Enter weight for ONE SIDE (kg). (App assumes 20kg Bar)";
            } else if (['pushup', 'squat_bw'].includes(type)) {
                hint.innerText = "Bodyweight exercise.";
                
                // Force 0 value for Bodyweight logic
                weightInput.innerHTML = '<option value="0">0 kg</option>';
                weightInput.value = 0;
                weightInput.disabled = true;

            } else {
                hint.innerText = "Enter total weight stack/dumbbell weight (kg).";
                // Re-populate if it was cleared by BW logic
                if(weightInput.options.length < 2) populateGymDropdowns(); 
            }
        }

        function logExercise() {
            const type = document.getElementById('gym-select').value;
            let weight = parseFloat(document.getElementById('gym-weight').value);
            const sets = document.getElementById('gym-sets').value;
            const date = document.getElementById('gym-date').value; // Use the selected date

            if(!sets) return alert("Enter sets");
            if(!date) return alert("Enter date");

            let displayWeight = weight;
            let displayString = "";

            // LOGIC HANDLER
            if(['deadlift', 'bench', 'shoulder', 'squat_bar'].includes(type)) {
                displayWeight = (weight * 2) + 20; 
                displayString = `${displayWeight} kg`;
            } else if(['pushup', 'squat_bw'].includes(type)) {
                displayWeight = 0;
                displayString = "0 kg";
            } else {
                displayString = `${weight} kg`;
            }

            appData.exercises.unshift({
                date: date,
                type: type,
                inputWeight: weight, 
                totalWeight: displayWeight,
                displayString: displayString,
                sets: sets
            });
            
            // Sort exercises by date (newest first)
            appData.exercises.sort((a,b) => new Date(b.date) - new Date(a.date));

            saveData();
            loadGymDiary();
        }

        function loadGymDiary() {
            const container = document.getElementById('gym-diary');
            if(!container) return;
            container.innerHTML = '';

            if(appData.exercises.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center italic">No workouts logged yet.</p>';
                return;
            }

            // Group by Date
            const grouped = {};
            appData.exercises.forEach(ex => {
                if(!grouped[ex.date]) grouped[ex.date] = [];
                grouped[ex.date].push(ex);
            });

            // Get Sorted Dates
            const sortedDates = Object.keys(grouped).sort((a,b) => new Date(b) - new Date(a));

            // Render Groups
            sortedDates.forEach(dateStr => {
                const dateObj = new Date(dateStr);
                const prettyDate = dateObj.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'bg-cardbg rounded-lg border border-gray-800 overflow-hidden';
                
                let html = `<div class="bg-gray-800 px-4 py-2 flex justify-between items-center">
                                <span class="text-lime font-bold text-sm">${prettyDate}</span>
                                <span class="text-xs text-gray-500">${grouped[dateStr].length} Exercises</span>
                            </div>`;
                
                html += '<ul class="divide-y divide-gray-700">';
                
                grouped[dateStr].forEach(ex => {
                    let name = ex.type.replace('_', ' ').toUpperCase();
                    // Fallback for older data that didn't have displayString
                    let weightStr = ex.displayString || (ex.totalWeight > 0 ? ex.totalWeight + " kg" : "0 kg");

                    html += `<li class="px-4 py-3 flex justify-between items-center hover:bg-white/5">
                                <span class="text-sm text-gray-300">${name}</span>
                                <div class="text-right">
                                    <span class="block text-neon font-bold text-sm">${ex.sets} Sets</span>
                                    <span class="block text-xs text-gray-500">${weightStr}</span>
                                </div>
                             </li>`;
                });
                
                html += '</ul>';
                groupDiv.innerHTML = html;
                container.appendChild(groupDiv);
            });
        }

        // --- DASHBOARD CHARTS ---

        function loadDashboard() {
            if(appData.weight.length > 0) {
                const lastW = appData.weight[appData.weight.length-1].value; 
                const hFeet = parseFloat(appData.user.height); 
                const hM = hFeet * 0.3048;
                const bmi = lastW / (hM * hM); 
                document.getElementById('bmi-display').innerText = bmi.toFixed(1);

                const firstW = appData.weight[0].value;
                const diff = lastW - firstW;
                const elem = document.getElementById('weight-loss-display');
                elem.innerText = (diff > 0 ? '+' : '') + diff.toFixed(1) + ' kg';
                elem.className = diff <= 0 ? 'text-2xl font-bold text-lime' : 'text-2xl font-bold text-danger';
            }

            renderChart('weightChart', appData.weight, 'Weight (kg)', '#00E5FF');
            renderChart('calChart', appData.calories, 'Calories', '#E040FB');
            renderChart('proteinChart', appData.protein, 'Protein', '#76FF03');
        }

        function renderChart(canvasId, dataArr, label, color) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            const slice = dataArr.slice(-14);
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: slice.map(d => d.date.substring(5)), 
                    datasets: [{
                        label: label,
                        data: slice.map(d => d.value),
                        borderColor: color,
                        backgroundColor: color + '20',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#333' }, ticks: { color: '#888' } },
                        x: { grid: { display: false }, ticks: { color: '#888' } }
                    }
                }
            });
        }

        // --- MEDS (GLP-1) ---

        function logMeds() {
            const date = document.getElementById('glp-date').value;
            if(!date) return;
            appData.glp1.push({ date: date });
            appData.glp1.sort((a,b) => new Date(b.date) - new Date(a.date));
            saveData();
            loadMeds();
        }

        function loadMeds() {
            const list = document.getElementById('meds-list');
            list.innerHTML = '';
            
            if(appData.glp1.length > 0) {
                const last = new Date(appData.glp1[0].date);
                const next = new Date(last);
                next.setDate(last.getDate() + 7);
                
                const today = new Date();
                const diffTime = next - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                document.getElementById('days-left').innerText = diffDays > 0 ? `${diffDays} Days` : "DUE NOW";
                document.getElementById('days-left').className = diffDays > 0 ? "text-4xl font-bold text-lime" : "text-4xl font-bold text-danger animate-pulse";
                document.getElementById('next-date').innerText = `Scheduled: ${next.toLocaleDateString()}`;

                appData.glp1.forEach(m => {
                    list.innerHTML += `<li><i class="fas fa-check text-lime mr-2"></i> ${m.date}</li>`;
                });
            } else {
                document.getElementById('days-left').innerText = "--";
            }
        }

        // --- PREDICTOR ---

        function calculatePrediction() {
            const targetDateInput = document.getElementById('pred-date').value;
            if(!targetDateInput || appData.weight.length < 2) return alert("Need at least 2 weight logs and a target date.");

            const data = appData.weight.slice(-14);
            const startTimestamp = new Date(data[0].date).getTime();
            
            const points = data.map(d => {
                const dayNum = (new Date(d.date).getTime() - startTimestamp) / (1000 * 3600 * 24);
                return { x: dayNum, y: d.value };
            });

            const n = points.length;
            const sumX = points.reduce((acc, p) => acc + p.x, 0);
            const sumY = points.reduce((acc, p) => acc + p.y, 0);
            const sumXY = points.reduce((acc, p) => acc + (p.x * p.y), 0);
            const sumXX = points.reduce((acc, p) => acc + (p.x * p.x), 0);

            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            const targetTimestamp = new Date(targetDateInput).getTime();
            const targetDayNum = (targetTimestamp - startTimestamp) / (1000 * 3600 * 24);
            const predictedWeight = (slope * targetDayNum) + intercept;

            document.getElementById('pred-result').classList.remove('hidden');
            document.getElementById('pred-value').innerText = predictedWeight.toFixed(1) + " kg";
            document.getElementById('trend-rate').innerText = `${slope.toFixed(2)} kg/day`;
            
            if(slope > 0) document.getElementById('pred-value').classList.replace('text-neon', 'text-danger');
            else document.getElementById('pred-value').classList.replace('text-danger', 'text-neon');
        }

        // --- UTILS ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "angad_glp_data.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // Start
        init();

    </script>
</body>
</html>
